<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile Layout Tests</title>
<style>
  body { font-family: monospace; background: #c0c0c0; }
  .pass { color: green; } .fail { color: red; }
  iframe { display: block; border: 0; margin-top: 12px; }
</style>
</head>
<body>
<h1>Mobile Layout Tests</h1>
<div id="results"></div>
<div id="summary">Running…</div>
<script>
(async () => {
  let passed = 0, failed = 0;
  const results = document.getElementById('results');
  function check(name, condition) {
    const row = document.createElement('div');
    row.className = condition ? 'pass' : 'fail';
    row.textContent = (condition ? 'PASS ' : 'FAIL ') + name;
    results.appendChild(row);
    if (condition) passed++; else failed++;
  }
  function settle() { return new Promise(resolve => setTimeout(resolve, 350)); }
  async function load(path, width, height = 740) {
    const frame = document.createElement('iframe');
    frame.style.width = width + 'px';
    frame.style.height = height + 'px';
    frame.src = path;
    await new Promise((resolve, reject) => {
      frame.onload = resolve;
      frame.onerror = reject;
      document.body.appendChild(frame);
    });
    await settle();
    return frame;
  }
  try {
    const invertPreference = localStorage.getItem('desktop.ui.invert');
    localStorage.setItem('desktop.ui.invert', 'true');
    const frame = await load('index.html', 390);
    if (invertPreference === null) localStorage.removeItem('desktop.ui.invert');
    else localStorage.setItem('desktop.ui.invert', invertPreference);
    const win = frame.contentWindow, doc = frame.contentDocument;
    check('Mobile login buttons are compact', ['login-ok', 'login-hint'].every(id => {
      const height = doc.getElementById(id).getBoundingClientRect().height;
      return height >= 28 && height <= 32;
    }));
    check('Mobile starts uninverted even with a saved On preference', !doc.body.classList.contains('desktop-ui-inverted'));
    doc.getElementById('password-input').value = win.eval('SITE_PASSWORD');
    await win.eval('tryLogin()');
    await settle();
    check('Music player starts minimized with a taskbar entry',
      win.eval('openWindows.mediaplayer.minimized') &&
      doc.querySelector('.face-window').style.display === 'none' &&
      !!doc.querySelector('.taskbar-item[data-id="mediaplayer"]'));
    doc.querySelector('.taskbar-item[data-id="mediaplayer"]').click();
    check('Music player can be restored', doc.querySelector('.face-window').style.display !== 'none');
    const player = doc.querySelector('.face-window');
    const playerRect = player.getBoundingClientRect();
    check('Mobile player retains the original skin and proportions',
      win.getComputedStyle(player.querySelector('.face-head-img')).display !== 'none' &&
      Math.abs(playerRect.width / playerRect.height - 380 / 630) < 0.001 &&
      win.getComputedStyle(player.querySelector('.face-hit')).position === 'absolute');
    check('Mobile player fits above the taskbar', playerRect.left >= 0 && playerRect.right <= 390 &&
      playerRect.bottom <= doc.getElementById('taskbar').getBoundingClientRect().top + 1);
    win.eval("closeWindow('mediaplayer'); closeWindow('browser')");
    const icon = doc.querySelector('.desktop-icon-item');
    check('Mobile icons use scattered positions', win.getComputedStyle(icon).position === 'absolute' && !!icon.style.getPropertyValue('--mobile-icon-left'));
    const initialScatter = [...doc.querySelectorAll('.desktop-icon-item')].map(el => el.style.getPropertyValue('--mobile-icon-left') + ',' + el.style.getPropertyValue('--mobile-icon-top')).join(';');
    win.eval('buildDesktopIcons()');
    await settle();
    check('Scatter stays stable when icons are rebuilt', initialScatter === [...doc.querySelectorAll('.desktop-icon-item')].map(el => el.style.getPropertyValue('--mobile-icon-left') + ',' + el.style.getPropertyValue('--mobile-icon-top')).join(';'));
    const myComputer = [...doc.querySelectorAll('.desktop-icon-item')].find(el => el.textContent.includes('My Computer'));
    myComputer.click();
    await settle();
    check('One tap opens My Computer', !!doc.querySelector('.win98-window'));
    const app = doc.querySelector('.win98-window');
    const bounds = () => ['left', 'top', 'width', 'height'].map(key => app.style[key]).join(',');
    const originalBounds = bounds();
    for (const width of [320, 375, 390, 430, 768]) {
      frame.style.width = width + 'px';
      await settle();
      const rect = app.getBoundingClientRect();
      check(width + 'px: no shell page overflow', doc.documentElement.scrollWidth <= width);
      check(width + 'px: window fits above taskbar', rect.left === 0 && rect.right <= width && rect.bottom <= doc.getElementById('taskbar').getBoundingClientRect().top + 1);
      const closeRect = app.querySelector('[data-action="close"]').getBoundingClientRect();
      check(width + 'px: compact but usable close control', closeRect.width >= 32 && closeRect.height >= 28 && closeRect.height <= 32);
      check(width + 'px: slim window and taskbar chrome', app.querySelector('.win98-titlebar').getBoundingClientRect().height === 32 && doc.getElementById('taskbar').getBoundingClientRect().height === 40);
      const iconRects = [...doc.querySelectorAll('.desktop-icon-item')].map(el => el.getBoundingClientRect());
      check(width + 'px: scattered icons stay within desktop width', iconRects.every(rect => rect.left >= 0 && rect.right <= width));
      check(width + 'px: scattered icons do not overlap', iconRects.every((rect, i) => iconRects.slice(i + 1).every(other => rect.right <= other.left || other.right <= rect.left || rect.bottom <= other.top || other.bottom <= rect.top)));
      const desktop = doc.getElementById('desktop-icons');
      check(width + 'px: all scattered icons are scrollable', Math.max(...iconRects.map(rect => rect.bottom)) <= desktop.scrollHeight);
    }
    app.querySelector('[data-action="min"]').click();
    check('Minimize hides app', app.style.display === 'none');
    doc.querySelector('.taskbar-item').click();
    check('Taskbar restores minimized app', app.style.display !== 'none');
    doc.getElementById('start-button').click();
    frame.style.width = '390px';
    const launcherItem = [...doc.querySelectorAll('.desktop-icon-item')].find(el => el.dataset.itemId);
    launcherItem.setPointerCapture = () => {};
    const initialTop = launcherItem.style.getPropertyValue('--mobile-icon-top');
    launcherItem.dispatchEvent(new win.PointerEvent('pointerdown', {
      bubbles: true, pointerType: 'touch', button: 0, clientX: 40, clientY: 40
    }));
    await new Promise(resolve => setTimeout(resolve, 600));
    check('Long press enables dragging without opening actions',
      launcherItem.classList.contains('mobile-dragging') && !doc.getElementById('ctx-menu'));
    launcherItem.dispatchEvent(new win.PointerEvent('pointermove', {
      bubbles: true, clientX: 40, clientY: 100
    }));
    launcherItem.dispatchEvent(new win.PointerEvent('pointerup', { bubbles: true }));
    check('Held icon can be rearranged', parseFloat(launcherItem.style.getPropertyValue('--mobile-icon-top')) === parseFloat(initialTop) + 60);
    check('Mobile icon arrangement is saved separately from desktop positions',
      JSON.parse(localStorage.getItem('mobile-desktop-icon-pos-' + launcherItem.dataset.itemId)).top === parseFloat(initialTop) + 60);
    launcherItem.click();
    launcherItem.click();
    launcherItem.click();
    check('Double tap opens item actions', !!doc.getElementById('ctx-menu'));
    win.eval('closeContextMenu()');
    localStorage.removeItem('mobile-desktop-icon-pos-' + launcherItem.dataset.itemId);
    delete launcherItem.setPointerCapture;
    launcherItem.dispatchEvent(new win.PointerEvent('pointerdown', {
      bubbles: true, pointerType: 'touch', button: 0, clientX: 40, clientY: 40
    }));
    doc.dispatchEvent(new win.PointerEvent('pointermove', { bubbles: true, clientX: 40, clientY: 90 }));
    await new Promise(resolve => setTimeout(resolve, 600));
    check('Scrolling cancels long press', !doc.getElementById('ctx-menu'));
    doc.dispatchEvent(new win.PointerEvent('pointercancel', { bubbles: true }));
    win.eval('openSolitaireWindow()');
    check('Entire mobile Solitaire table is green',
      win.getComputedStyle(doc.querySelector('.solitaire-window .win98-content')).backgroundColor === 'rgb(7, 99, 36)');
    win.eval("closeWindow('solitaire')");
    check('Programs available without hover', win.getComputedStyle(doc.getElementById('programs-submenu')).display !== 'none');
    doc.getElementById('start-button').click();
    frame.style.width = '667px'; frame.style.height = '375px';
    await settle();
    check('Landscape keeps close control above taskbar', app.querySelector('[data-action="close"]').getBoundingClientRect().bottom < doc.getElementById('taskbar').getBoundingClientRect().top);
    frame.style.width = '1280px'; frame.style.height = '900px';
    await settle();
    check('Desktop icon positioning restored', win.getComputedStyle(myComputer).left === myComputer.style.left);
    check('Desktop titlebar height unchanged', app.querySelector('.win98-titlebar').getBoundingClientRect().height === 20);
    check('Desktop window bounds unchanged', bounds() === originalBounds);
    app.querySelector('[data-action="close"]').click();
    myComputer.click();
    check('Desktop single click does not open app', !doc.querySelector('.win98-window'));
    myComputer.dispatchEvent(new win.MouseEvent('dblclick', { bubbles: true }));
    check('Desktop double click still opens app', !!doc.querySelector('.win98-window'));
    frame.remove();

    for (const path of [
      'apps/chroma/index.html', 'apps/chroma/diary.html', 'apps/echo-trail/index.html',
      'apps/macro-diary/index.html', 'apps/static/index.html', 'apps/spectrum/index.html',
      'apps/spectrumindex.html', 'apps/colormixer95/colormixer95.html', 'apps/flightindex.html'
    ]) {
      const appFrame = await load(path, 320);
      const appDoc = appFrame.contentDocument;
      const sizes = [{ width: 320, height: 740 }, { width: 430, height: 740 }];
      if (path === 'apps/chroma/index.html') sizes.push(
        { width: 375, height: 740 }, { width: 390, height: 740 },
        { width: 768, height: 1024 }, { width: 667, height: 375 }
      );
      for (const { width, height } of sizes) {
        appFrame.style.width = width + 'px';
        appFrame.style.height = height + 'px';
        await settle();
        check(path + ' at ' + width + 'px: no page overflow', appDoc.documentElement.scrollWidth <= width);
        if (path === 'apps/echo-trail/index.html') {
          const appWin = appFrame.contentWindow;
          const controls = appDoc.querySelector('.controls-panel');
          const canvas = appDoc.querySelector('.canvas-panel').getBoundingClientRect();
          const random = appDoc.getElementById('btn-randomize').getBoundingClientRect();
          check('Echo Trail ' + width + 'px: three swipeable control rows',
            appWin.getComputedStyle(controls).gridTemplateRows.split(' ').length === 3 &&
            controls.scrollWidth > controls.clientWidth &&
            appWin.getComputedStyle(controls).overflowX === 'auto');
          check('Echo Trail ' + width + 'px: preview precedes Randomize-first toolbar',
            canvas.bottom <= random.top && random.left < appDoc.getElementById('btn-load').getBoundingClientRect().left);
          check('Echo Trail ' + width + 'px: effect buttons match slider widths and have legible touch targets',
            [...controls.querySelectorAll('.item-toggle[data-target]')].every(button => {
              const slider = appDoc.getElementById(button.dataset.target);
              if (slider.type !== 'range') return true;
              const rect = button.getBoundingClientRect();
              return Math.abs(rect.width - slider.getBoundingClientRect().width) < 1 &&
                rect.height >= 44 && parseFloat(appWin.getComputedStyle(button).fontSize) >= 14 &&
                button.scrollWidth <= button.clientWidth;
            }));
          const exposure = appDoc.getElementById('image-exposure');
          const exposureToggle = controls.querySelector('[data-target="image-exposure"]');
          exposure.value = '75';
          exposureToggle.click();
          check('Echo Trail ' + width + 'px: Exposure off preserves the slider and uses default exposure',
            !exposureToggle.classList.contains('active') && exposure.value === '75' &&
            appWin.eval("rowVal('image-exposure')") === 50);
          exposureToggle.click();
          check('Echo Trail ' + width + 'px: Exposure on restores its setting',
            appWin.eval("rowVal('image-exposure')") === 75);
          appDoc.getElementById('btn-off').click();
          appDoc.getElementById('btn-reset').click();
          check('Echo Trail ' + width + 'px: Reset restores Exposure',
            exposureToggle.classList.contains('active') && exposure.value === '50');
          controls.scrollLeft = controls.scrollWidth;
          await settle();
          check('Echo Trail ' + width + 'px: last slider is reachable by swiping', controls.scrollLeft > 0 &&
            appDoc.getElementById('fx-txtgrain').getBoundingClientRect().right <= controls.getBoundingClientRect().right);
        }
        if (path === 'apps/echo-trail/index.html') {
          appFrame.style.width = '1280px';
          appFrame.style.height = '900px';
          await settle();
          const appWin = appFrame.contentWindow;
          check('Desktop Echo Trail keeps its original controls and toolbar order',
            appWin.getComputedStyle(appDoc.querySelector('.controls-panel')).display === 'flex' &&
            appDoc.getElementById('btn-load').getBoundingClientRect().left < appDoc.getElementById('btn-randomize').getBoundingClientRect().left);
        }
        if (path === 'apps/chroma/index.html') {
          const appWin = appFrame.contentWindow;
          const main = appDoc.querySelector('#desktop > .window');
          const controls = appDoc.querySelector('.mobile-controls');
          const menubar = appDoc.querySelector('.menubar');
          const canvas = appDoc.getElementById('cc-canvas');
          const canvasRect = canvas.getBoundingClientRect();
          check('Chroma ' + width + 'px: controls fit without horizontal scrolling', main.scrollWidth <= main.clientWidth && controls.scrollWidth <= controls.clientWidth);
          const visible = element => element.getClientRects().length > 0 && appWin.getComputedStyle(element).visibility !== 'hidden';
          check('Chroma ' + width + 'px: menus and standalone taskbar are hidden', !visible(menubar) && !visible(appDoc.getElementById('taskbar')));
          check('Chroma ' + width + 'px: only three buttons and sliders remain', [...controls.querySelectorAll('button, input, select, [tabindex]')].filter(visible).every(element =>
            element.matches('input[type="range"], #pastrami-btn, #cc-load-image, #cc-save-image')
          ) && [...controls.querySelectorAll('button')].filter(visible).length === 3);
          check('Chroma ' + width + 'px: mobile button labels', ['pastrami-btn', 'cc-load-image', 'cc-save-image'].map(id => appDoc.getElementById(id).innerText.trim()).join(',') === 'Technochrome,Load,Save');
          check('Chroma ' + width + 'px: canvas stays square and nearly phone-width', Math.abs(canvasRect.width - canvasRect.height) < 1 && canvasRect.width >= width * 0.9 && canvas.width === canvas.height);
          check('Chroma ' + width + 'px: canvas appears before controls', canvasRect.top >= 0 && canvasRect.bottom <= controls.getBoundingClientRect().top);
          check('Chroma ' + width + 'px: controls retain three rows', appWin.getComputedStyle(controls).gridTemplateRows.split(' ').length === 3);
          const rows = [
            ['cc-techno', 'cc-weird'],
            ['cc-hue', 'cc-sat'],
            ['pastrami-btn', 'cc-load-image', 'cc-save-image']
          ].map(ids => ids.map(id => appDoc.getElementById(id).getBoundingClientRect()));
          check('Chroma ' + width + 'px: sliders and buttons occupy the requested rows', rows.every(row =>
            row.every(rect => Math.abs(rect.top - row[0].top) < 1) &&
            row.every((rect, index) => !index || rect.left > row[index - 1].right)
          ) && rows[0][0].bottom < rows[1][0].top && rows[1][0].bottom < rows[2][0].top);
          check('Chroma ' + width + 'px: slider pairs match the full button row width', rows.slice(0, 2).every(row =>
            Math.abs(row[0].left - rows[2][0].left) < 1 &&
            Math.abs(row[1].right - rows[2][2].right) < 1 &&
            Math.abs(row[0].width - row[1].width) < 1
          ));
          check('Chroma ' + width + 'px: slider tracks have a small visible gap', rows.slice(0, 2).every(row =>
            row[1].left - row[0].right >= 4 && row[1].left - row[0].right <= 8
          ));
          const actionButtons = ['pastrami-btn', 'cc-load-image', 'cc-save-image'].map(id => appDoc.getElementById(id));
          const actionBounds = () => actionButtons.map(button => {
            const rect = button.getBoundingClientRect();
            return [rect.left, rect.top, rect.width, rect.height].join(',');
          }).join(';');
          const initialActionBounds = actionBounds();
          actionButtons[0].click();
          await settle();
          check('Chroma ' + width + 'px: buttons stay in place with Technochrome off', actionButtons[0].getAttribute('aria-pressed') === 'false' && actionBounds() === initialActionBounds);
          actionButtons[0].click();
          await settle();
          check('Chroma ' + width + 'px: buttons stay in place with Technochrome on', actionButtons[0].getAttribute('aria-pressed') === 'true' && actionBounds() === initialActionBounds);
          check('Chroma ' + width + 'px: sliders have transparent, non-recessed touch areas', [...appDoc.querySelectorAll('input[type="range"]')].every(slider => {
            const style = appWin.getComputedStyle(slider);
            return style.backgroundColor === 'rgba(0, 0, 0, 0)' && style.boxShadow === 'none' && slider.getBoundingClientRect().height >= 32;
          }));
          main.scrollTop = 0;
          controls.scrollLeft = 0;
          await settle();
          for (const id of ['cc-techno', 'cc-weird']) {
            const slider = appDoc.getElementById(id);
            const original = slider.value;
            const before = canvas.toDataURL();
            slider.value = slider.max;
            slider.dispatchEvent(new appWin.Event('input', { bubbles: true }));
            check('Chroma ' + width + 'px: ' + id + ' updates the grid', canvas.toDataURL() !== before);
            slider.value = original;
            slider.dispatchEvent(new appWin.Event('input', { bubbles: true }));
          }
          canvas.dispatchEvent(new appWin.MouseEvent('click', { bubbles: true, clientX: canvasRect.left + canvasRect.width / 2, clientY: canvasRect.top + canvasRect.height / 2 }));
          check('Chroma ' + width + 'px: tapping canvas selects a color', /^#[0-9A-F]{6}$/.test(appDoc.getElementById('cc-hexbox').textContent));
          appDoc.getElementById('cc-save-image').scrollIntoView();
          const saveRect = appDoc.getElementById('cc-save-image').getBoundingClientRect();
          check('Chroma ' + width + 'px: Save remains reachable', saveRect.bottom <= appFrame.clientHeight && saveRect.left >= 0 && saveRect.right <= width);
          main.scrollTop = 0;
          controls.scrollLeft = 0;
        }
      }
      if (path === 'apps/chroma/index.html') {
        const appWin = appFrame.contentWindow;
        const importInput = appDoc.getElementById('cc-photo-import');
        let openedPicker = false;
        importInput.click = () => { openedPicker = true; };
        appDoc.getElementById('cc-load-image').click();
        check('Mobile Chroma Load opens the image picker', openedPicker && importInput.accept === 'image/*');
        delete importInput.click;
        const sample = appDoc.createElement('canvas');
        sample.width = sample.height = 10;
        sample.getContext('2d').fillStyle = '#ff0000';
        sample.getContext('2d').fillRect(0, 0, 10, 10);
        const photo = await new Promise(resolve => sample.toBlob(resolve, 'image/png'));
        const transfer = new appWin.DataTransfer();
        transfer.items.add(new appWin.File([photo], 'mobile-photo.png', { type: 'image/png' }));
        const beforeUpload = appDoc.getElementById('cc-canvas').toDataURL();
        importInput.files = transfer.files;
        importInput.dispatchEvent(new appWin.Event('change', { bubbles: true }));
        for (let attempt = 0; attempt < 20 && importInput.value; attempt++) await settle();
        check('Mobile Chroma Upload imports a phone photo as a palette', appDoc.getElementById('cc-style-btn').textContent.includes('Photo Palette') &&
          appDoc.getElementById('cc-canvas').toDataURL() !== beforeUpload && importInput.value === '');
        const originalClick = appWin.HTMLAnchorElement.prototype.click;
        let download;
        try {
          download = await new Promise((resolve, reject) => {
            const timeout = setTimeout(() => reject(new Error('Save did not download an image')), 5000);
            appWin.HTMLAnchorElement.prototype.click = function() {
              clearTimeout(timeout);
              resolve({ name: this.download, url: this.href });
            };
            appDoc.getElementById('cc-save-image').click();
          });
        } finally {
          appWin.HTMLAnchorElement.prototype.click = originalClick;
        }
        const savedImage = await appWin.fetch(download.url).then(response => response.blob());
        check('Mobile Chroma Save downloads a PNG to the device', /^technochrome-palette-.*\.png$/.test(download.name) &&
          download.url.startsWith('blob:') && savedImage.type === 'image/png' && savedImage.size > 0);
        appFrame.style.width = '1280px';
        appFrame.style.height = '1000px';
        await settle();
        check('Desktop Chroma keeps original control layout', appWin.getComputedStyle(appDoc.querySelector('.mobile-controls')).display === 'contents' && appWin.getComputedStyle(appDoc.querySelector('.ctrlbar')).display === 'flex');
        check('Desktop Chroma keeps original control order', appDoc.querySelector('.menubar').getBoundingClientRect().top < appDoc.querySelector('.ctrlbar').getBoundingClientRect().top && appDoc.querySelector('.ctrlbar').getBoundingClientRect().bottom <= appDoc.querySelector('.winbody').getBoundingClientRect().top);
        check('Desktop Chroma keeps Diary+ without a separate Diary button', !appDoc.getElementById('cc-diary-open') && !!appDoc.getElementById('cc-diary-add'));
        check('Desktop Chroma top menu omits Techno and Technochrome', !appDoc.getElementById('menu-help') && !appDoc.getElementById('menu-techno'));
        check('Desktop Chroma keeps original button labels and extra controls', appDoc.getElementById('cc-load-image').innerText.trim() === 'Load Image' &&
          appDoc.getElementById('pastrami-btn').innerText.trim() === 'Technochrome' && appDoc.getElementById('cc-shuffle').getBoundingClientRect().width > 0 &&
          appWin.getComputedStyle(appDoc.querySelector('.menubar')).display !== 'none');
      }
      check(path + ': viewport declared', !!appDoc.querySelector('meta[name="viewport"]'));
      appFrame.remove();
    }
  } catch (error) {
    check('Unexpected error: ' + error.message, false);
  }
  document.getElementById('summary').textContent = passed + ' passed, ' + failed + ' failed';
})();
</script>
</body>
</html>
